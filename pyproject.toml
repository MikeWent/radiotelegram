[project]
name = "radiotelegram"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.2",
    "pytelegrambotapi>=4.28.0",
    "python-dotenv>=1.1.1",
    "scipy>=1.16.0",
    "ten-vad>=1.0.6; sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64')",
    "pybind11>=2.13.6; sys_platform == 'linux' and (platform_machine == 'aarch64' or platform_machine == 'arm64')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
