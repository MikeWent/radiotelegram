services:
  radiotelegram:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radiotelegram
    restart: always
    
    # Environment variables
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_TOPIC_ID=${TELEGRAM_TOPIC_ID}
      - AUDIO_DEVICE=${AUDIO_DEVICE:-hw:1,0}
      - AUDIO_OUTPUT_DEVICE=${AUDIO_OUTPUT_DEVICE:-hw:1,0}
      - TX_VOLUME_CONTROL=${TX_VOLUME_CONTROL:-PCM}
      - TX_VOLUME=${TX_VOLUME:-100%}
      - RX_VOLUME_CONTROL=${RX_VOLUME_CONTROL:-Mic}
      - RX_VOLUME=${RX_VOLUME:-100%}
      - TX_WAKE_TONE_FREQUENCY=${TX_WAKE_TONE_FREQUENCY:-1750}
      - TX_WAKE_TONE_DURATION=${TX_WAKE_TONE_DURATION:-2.0}
      - TX_WAKE_TONE_DELAY=${TX_WAKE_TONE_DELAY:-0}
      - VAD_THRESHOLD=${VAD_THRESHOLD:-0.5}
      - VAD_MIN_VOICE_RATIO=${VAD_MIN_VOICE_RATIO:-0.01}
      - VAD_MIN_MAX_PROBABILITY=${VAD_MIN_MAX_PROBABILITY:-0.55}
      - VAD_MIN_AVG_PROBABILITY=${VAD_MIN_AVG_PROBABILITY:-0.2}
      - VAD_MIN_ANALYSIS_DURATION=${VAD_MIN_ANALYSIS_DURATION:-0.5}
      - SQUELCH_OPEN_THRESHOLD=${SQUELCH_OPEN_THRESHOLD:-0.65}
      - SQUELCH_CLOSE_THRESHOLD=${SQUELCH_CLOSE_THRESHOLD:-0.55}
      - SQUELCH_MIN_ABSOLUTE_LEVEL_DB=${SQUELCH_MIN_ABSOLUTE_LEVEL_DB:--40.0}
    
    # Load environment from .env file
    env_file:
      - .env
    
    # Audio device access
    devices:
      - /dev/snd:/dev/snd  # ALSA sound devices
      - /dev/bus/usb:/dev/bus/usb  # USB devices
    
    # Volume mounts for ALSA configuration
    volumes:
      - ten-vad-build:/opt/ten-vad/build
      - /usr/share/alsa:/usr/share/alsa:ro
      - /etc/asound.conf:/etc/asound.conf:ro
    
    # Privileged mode for full hardware access
    privileged: true
    
    cap_add:
      - SYS_NICE  # For audio priority
      - SYS_ADMIN  # For device management

volumes:
  ten-vad-build:
